name: Test predicate-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subject artifact
        run: |
          echo "hello world" > /tmp/subject-artifact.txt

      - name: Create predicate file
        run: |
          cat > /tmp/predicate.json <<'EOF'
          {
            "buildType": "https://example.com/build/v1",
            "builder": {
              "id": "https://example.com/builder"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          subject-path: /tmp/subject-artifact.txt
          predicate-type: "https://example.com/build/v1"
          predicate-path: /tmp/predicate.json
          show-summary: false

      - name: Assert bundle-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "actual bundle-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected bundle-path to be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert bundle file exists
        env:
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "bundle-path: $BUNDLE_PATH"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
            exit 1
          fi
          echo "PASS"
