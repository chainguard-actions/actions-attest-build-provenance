name: Test subject-checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subject artifacts and checksums file
        run: |
          echo "artifact one" > /tmp/artifact-one.txt
          echo "artifact two" > /tmp/artifact-two.txt
          cd /tmp
          sha256sum artifact-one.txt artifact-two.txt > /tmp/checksums.txt
          echo "Checksums file contents:"
          cat /tmp/checksums.txt

      - id: action
        uses: .
        with:
          subject-checksums: /tmp/checksums.txt
          show-summary: false

      - name: Assert bundle-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "actual bundle-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected bundle-path to be set"
            exit 1
          fi
          echo "PASS"

      - name: Assert bundle file exists
        env:
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
        run: |
          echo "bundle-path: $BUNDLE_PATH"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
            exit 1
          fi
          echo "PASS"
