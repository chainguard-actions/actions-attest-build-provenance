name: Test attest-build-provenance with subject-checksums
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create checksums file
        run: |
          echo "a948904f2f0f479b8f936065f3a9d6b9f8b7e8b2c3d4e5f6a7b8c9d0e1f2a3b  artifact-linux-amd64" > /tmp/checksums.txt
          echo "b948904f2f0f479b8f936065f3a9d6b9f8b7e8b2c3d4e5f6a7b8c9d0e1f2a3c  artifact-linux-arm64" >> /tmp/checksums.txt
          cat /tmp/checksums.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-checksums: /tmp/checksums.txt
          show-summary: false

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.action.outputs.attestation-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          echo "attestation-url: $ATTESTATION_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle-path '$BUNDLE_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: attestation bundle created at $BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for attestation API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
