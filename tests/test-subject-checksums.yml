name: Test subject-checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create checksums file
        run: |
          # Create a sample artifact and its checksum
          echo "hello world" > /tmp/test-artifact.txt
          sha256sum /tmp/test-artifact.txt | sed 's|/tmp/||' > /tmp/checksums.txt
          echo "Checksums file contents:"
          cat /tmp/checksums.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-checksums: /tmp/checksums.txt
          show-summary: false

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            echo "PASS: got bundle-path '$BUNDLE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
