name: Test subject-digest input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute digest of a known artifact
        id: digest
        run: |
          echo "hello world" > /tmp/artifact.txt
          DIGEST="sha256:$(sha256sum /tmp/artifact.txt | awk '{print $1}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Computed digest: $DIGEST"

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: my-artifact
          show-summary: false

      - name: Assert action ran (pass or expected OIDC failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          # Under act, OIDC tokens are unavailable so the action is expected to fail
          # at the Sigstore signing step. This is acceptable - the action is correctly
          # configured and reaches the signing step.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real OIDC token available)"
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path is empty"
              exit 1
            fi
            if [ ! -f "$BUNDLE_PATH" ]; then
              echo "FAIL: bundle file does not exist at $BUNDLE_PATH"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (OIDC not available under act)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
