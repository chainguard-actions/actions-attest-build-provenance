name: Test usage with subject-digest and subject-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute a digest for a test artifact
        id: digest
        run: |
          echo "test artifact content" > /tmp/artifact.bin
          DIGEST="sha256:$(sha256sum /tmp/artifact.bin | awk '{print $1}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Computed digest: $DIGEST"

      - id: action
        uses: .
        continue-on-error: true
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: my-test-artifact
          show-summary: false

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE_PATH: ${{ steps.action.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.action.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.action.outputs.attestation-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle-path: $BUNDLE_PATH"
          echo "attestation-id: $ATTESTATION_ID"
          echo "attestation-url: $ATTESTATION_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUNDLE_PATH" ]; then
              echo "FAIL: action succeeded but bundle-path output is empty"
              exit 1
            fi
            echo "PASS: attestation created, bundle-path=$BUNDLE_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for attestation API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
