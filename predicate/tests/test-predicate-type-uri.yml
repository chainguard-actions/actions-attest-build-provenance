name: Test predicate-type is a valid URI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate-type is a valid URI
        env:
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: action succeeded but predicate-type output is empty"
              exit 1
            fi
            # Predicate type should be a URI (starts with https:// or http://)
            if echo "$PREDICATE_TYPE" | grep -qE '^https?://'; then
              echo "PASS: predicate-type is a valid URI: $PREDICATE_TYPE"
            else
              echo "FAIL: predicate-type does not look like a URI: $PREDICATE_TYPE"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist/index.js may not be present in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
