name: Test build provenance predicate structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate contains expected SLSA provenance fields (if action succeeded)
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "predicate: $PREDICATE"
          # SLSA 0.2 uses 'builder', SLSA 1.0 uses 'buildDefinition'/'runDetails'
          HAS_BUILDER=$(echo "$PREDICATE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if 'builder' in d else 'no')" 2>/dev/null || echo "no")
          HAS_BUILD_DEF=$(echo "$PREDICATE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if 'buildDefinition' in d else 'no')" 2>/dev/null || echo "no")
          HAS_RUN_DETAILS=$(echo "$PREDICATE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if 'runDetails' in d else 'no')" 2>/dev/null || echo "no")
          echo "has_builder: $HAS_BUILDER"
          echo "has_buildDefinition: $HAS_BUILD_DEF"
          echo "has_runDetails: $HAS_RUN_DETAILS"
          if [ "$HAS_BUILDER" = "yes" ] || [ "$HAS_BUILD_DEF" = "yes" ] || [ "$HAS_RUN_DETAILS" = "yes" ]; then
            echo "PASS: predicate contains expected SLSA provenance fields"
          else
            echo "FAIL: predicate missing expected SLSA provenance fields (builder, buildDefinition, or runDetails)"
            exit 1
          fi
      - name: Assert predicate-type matches known SLSA provenance URI (if action succeeded)
        env:
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping predicate-type validation"
            exit 0
          fi
          echo "predicate-type: $PREDICATE_TYPE"
          if echo "$PREDICATE_TYPE" | grep -qE 'slsa\.dev/provenance'; then
            echo "PASS: predicate-type is a known SLSA provenance URI"
          else
            echo "FAIL: predicate-type '$PREDICATE_TYPE' is not a known SLSA provenance URI"
            exit 1
          fi
