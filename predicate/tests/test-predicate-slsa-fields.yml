name: Test predicate contains expected SLSA provenance fields
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: predicate
        uses: .
        continue-on-error: true

      - name: Assert predicate contains SLSA builder or runDetails field
        env:
          PREDICATE: ${{ steps.predicate.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.predicate.outputs.predicate-type }}
          OUTCOME: ${{ steps.predicate.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act harness without full GitHub Actions context)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -z "$PREDICATE" ]; then
            echo "FAIL: predicate output is empty"
            exit 1
          fi
          echo "predicate: $PREDICATE"
          # SLSA v0.2 has 'builder', SLSA v1.0 has 'runDetails'
          # Use grep to check for expected SLSA fields
          if echo "$PREDICATE" | grep -q '"builder"' || echo "$PREDICATE" | grep -q '"runDetails"'; then
            echo "PASS: predicate contains expected SLSA field (builder or runDetails)"
          else
            echo "FAIL: predicate missing expected SLSA provenance fields (builder or runDetails)"
            exit 1
          fi
          # predicate-type should reference slsa-provenance
          echo "predicate-type: $PREDICATE_TYPE"
          if echo "$PREDICATE_TYPE" | grep -qi "slsa"; then
            echo "PASS: predicate-type references SLSA: $PREDICATE_TYPE"
          else
            echo "FAIL: predicate-type does not reference SLSA: $PREDICATE_TYPE"
            exit 1
          fi
