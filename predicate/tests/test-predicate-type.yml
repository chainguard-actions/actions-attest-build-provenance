name: Test predicate-type output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate-type is a valid URI or graceful failure
        env:
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: action succeeded but predicate-type output is empty"
              exit 1
            fi
            if ! echo "$PREDICATE_TYPE" | grep -qE '^https?://'; then
              echo "FAIL: predicate-type is not a valid URI: $PREDICATE_TYPE"
              exit 1
            fi
            if ! echo "$PREDICATE_TYPE" | grep -qiE '(slsa|provenance|in-toto)'; then
              echo "FAIL: predicate-type does not reference SLSA/provenance: $PREDICATE_TYPE"
              exit 1
            fi
            echo "PASS: predicate-type '$PREDICATE_TYPE' is a valid SLSA/provenance URI"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
