name: Test predicate output is valid JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: predicate
        uses: .
        continue-on-error: true

      - name: Assert predicate is valid JSON when action succeeds
        env:
          PREDICATE: ${{ steps.predicate.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.predicate.outputs.predicate-type }}
          OUTCOME: ${{ steps.predicate.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act harness without full GitHub Actions context)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Action succeeded - validate outputs
          if [ -z "$PREDICATE" ]; then
            echo "FAIL: predicate output is empty"
            exit 1
          fi
          echo "predicate: $PREDICATE"
          # Validate it is parseable JSON
          if ! echo "$PREDICATE" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: predicate is not valid JSON"
            exit 1
          fi
          echo "PASS: predicate is valid JSON"
          # predicate-type should look like a URI
          echo "predicate-type: $PREDICATE_TYPE"
          case "$PREDICATE_TYPE" in
            https://*|http://*)
              echo "PASS: predicate-type is a URI: $PREDICATE_TYPE"
              ;;
            *)
              echo "FAIL: predicate-type does not look like a URI: $PREDICATE_TYPE"
              exit 1
              ;;
          esac
