name: Test predicate output is valid JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate is valid JSON
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate: $PREDICATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: action succeeded but predicate output is empty"
              exit 1
            fi
            # Validate that the predicate is valid JSON
            if echo "$PREDICATE" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
              echo "PASS: predicate is valid JSON"
            else
              echo "FAIL: predicate is not valid JSON"
              exit 1
            fi
            # The predicate should be a JSON object (starts with '{')
            TRIMMED="$(echo "$PREDICATE" | tr -d '[:space:]')"
            if echo "$TRIMMED" | grep -q '^{'; then
              echo "PASS: predicate is a JSON object"
            else
              echo "FAIL: predicate does not appear to be a JSON object: $PREDICATE"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dist/index.js may not be present in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
