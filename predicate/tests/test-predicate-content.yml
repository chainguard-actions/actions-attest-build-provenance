name: Test predicate content has expected provenance fields
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate content has provenance fields
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          echo "predicate: $PREDICATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: action succeeded but predicate is empty"
              exit 1
            fi
            # Validate predicate is valid JSON and is a non-empty object
            KEYS=$(echo "$PREDICATE" | python3 -c "import sys, json; d = json.load(sys.stdin); print(list(d.keys()))" 2>/dev/null)
            if [ $? -ne 0 ]; then
              echo "FAIL: predicate is not valid JSON"
              exit 1
            fi
            echo "Keys found: $KEYS"
            # Check for common SLSA provenance fields
            if echo "$PREDICATE" | python3 -c "import sys, json; d = json.load(sys.stdin); assert len(d) > 0, 'empty object'" 2>/dev/null; then
              echo "PASS: predicate is a non-empty JSON object"
            else
              echo "FAIL: predicate is an empty JSON object"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
