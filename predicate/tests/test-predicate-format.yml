name: Test predicate output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate-type is a valid URI and predicate is valid JSON
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          echo "predicate: $PREDICATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: predicate-type is empty"
              exit 1
            fi
            # predicate-type should be a URI (starts with https://)
            if ! echo "$PREDICATE_TYPE" | grep -qE '^https?://'; then
              echo "FAIL: predicate-type does not look like a URI: $PREDICATE_TYPE"
              exit 1
            fi
            echo "PASS: predicate-type is a valid URI"
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: predicate is empty"
              exit 1
            fi
            # Verify predicate is valid JSON by parsing it
            if ! echo "$PREDICATE" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
              echo "FAIL: predicate is not valid JSON"
              exit 1
            fi
            echo "PASS: predicate is valid JSON"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
