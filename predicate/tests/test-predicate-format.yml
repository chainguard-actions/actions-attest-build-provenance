name: Test predicate format - build provenance predicate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate is valid JSON and predicate-type is a URI
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate: $PREDICATE"
          echo "predicate-type: $PREDICATE_TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: action succeeded but predicate output is empty"
              exit 1
            fi
            # Validate it is parseable JSON
            if ! echo "$PREDICATE" | python3 -m json.tool > /dev/null 2>&1; then
              echo "FAIL: predicate is not valid JSON"
              exit 1
            fi
            echo "PASS: predicate is valid JSON"
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: action succeeded but predicate-type output is empty"
              exit 1
            fi
            # predicate-type should be a URI starting with https://
            case "$PREDICATE_TYPE" in
              https://*)
                echo "PASS: predicate-type is a valid https URI: $PREDICATE_TYPE"
                ;;
              *)
                echo "FAIL: predicate-type does not look like a URI: $PREDICATE_TYPE"
                exit 1
                ;;
            esac
            # SLSA provenance predicates typically contain buildDefinition or builder
            if echo "$PREDICATE" | grep -qE '"(buildDefinition|builder|runDetails)"'; then
              echo "PASS: predicate contains expected SLSA provenance fields"
            else
              echo "FAIL: predicate does not contain expected SLSA provenance fields (buildDefinition, builder, or runDetails)"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo or missing dist)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
