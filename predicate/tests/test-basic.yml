name: Test basic build provenance predicate generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate outputs or graceful failure
        env:
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          PREDICATE: ${{ steps.action.outputs.predicate }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          echo "predicate: $PREDICATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: action succeeded but predicate-type output is empty"
              exit 1
            fi
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: action succeeded but predicate output is empty"
              exit 1
            fi
            echo "$PREDICATE" > /tmp/predicate.json
            if ! python3 -m json.tool /tmp/predicate.json > /dev/null 2>&1; then
              echo "FAIL: predicate is not valid JSON"
              cat /tmp/predicate.json
              exit 1
            fi
            echo "PASS: predicate and predicate-type outputs are valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
