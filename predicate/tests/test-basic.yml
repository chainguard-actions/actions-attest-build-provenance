name: Test basic build provenance predicate generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert predicate output and predicate-type are set or action failed gracefully
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          echo "predicate: $PREDICATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: action succeeded but predicate output is empty"
              exit 1
            fi
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: action succeeded but predicate-type output is empty"
              exit 1
            fi
            echo "PASS: predicate and predicate-type outputs are non-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert predicate is valid JSON (if action succeeded)
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping JSON validation"
            exit 0
          fi
          echo "Validating predicate JSON..."
          if ! echo "$PREDICATE" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: predicate is not valid JSON"
            exit 1
          fi
          echo "PASS: predicate is valid JSON"
      - name: Assert predicate-type is a URI (if action succeeded)
        env:
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping URI validation"
            exit 0
          fi
          echo "predicate-type: $PREDICATE_TYPE"
          if ! echo "$PREDICATE_TYPE" | grep -qE '^https?://'; then
            echo "FAIL: predicate-type does not look like a URI (expected https://...)"
            exit 1
          fi
          echo "PASS: predicate-type is a URI"
