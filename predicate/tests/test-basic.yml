name: Test basic build provenance predicate generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert predicate outputs or graceful failure
        env:
          PREDICATE: ${{ steps.action.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.action.outputs.predicate-type }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "predicate-type: $PREDICATE_TYPE"
          echo "predicate: $PREDICATE"

          if [ "$OUTCOME" = "success" ]; then
            # predicate-type must be non-empty and look like a URI
            if [ -z "$PREDICATE_TYPE" ]; then
              echo "FAIL: predicate-type output is empty on success"
              exit 1
            fi
            if ! echo "$PREDICATE_TYPE" | grep -qE 'https?://|slsa\.dev|in-toto\.io'; then
              echo "FAIL: predicate-type does not look like a known provenance URI: $PREDICATE_TYPE"
              exit 1
            fi
            # predicate must be non-empty JSON
            if [ -z "$PREDICATE" ]; then
              echo "FAIL: predicate output is empty on success"
              exit 1
            fi
            FIRST_CHAR="$(echo "$PREDICATE" | tr -d '[:space:]' | cut -c1)"
            if [ "$FIRST_CHAR" != "{" ] && [ "$FIRST_CHAR" != "[" ]; then
              echo "FAIL: predicate does not appear to be JSON (first char: $FIRST_CHAR)"
              exit 1
            fi
            echo "PASS: predicate-type=$PREDICATE_TYPE, predicate is valid JSON"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or limited act context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
